name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # Permette di lanciarlo manualmente dal sito GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Crea local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties
          echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" >> local.properties
          echo "BASE_URL=https://prezzi-carburante.onrender.com/" >> local.properties

      - name: Rimuovi java.home locale da gradle.properties
        run: sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Rendi gradlew eseguibile
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Mostra SHA-1 debug keystore
        continue-on-error: true
        run: keytool -list -v -keystore /home/runner/.config/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep SHA1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FuelFinder-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7  # L'APK rimane scaricabile per 7 giorni